<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor HTML Jeindex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        #tech-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #020617; /* Navy Dark */
        }
        .preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.95);
            z-index: 50;
            padding: 2rem;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col overflow-hidden">
    
    <!-- Background Canvas -->
    <canvas id="tech-bg"></canvas>

    <!-- Header Section -->
    <header class="p-4 flex items-center justify-between border-b border-green-900 bg-slate-950/80 backdrop-blur-sm z-10">
        <div class="flex items-center gap-4">
            <a href="https://freeimage.host/"><img src="https://iili.io/Bym6FY7.png" alt="Logo Jeindex" class="h-12 w-12 object-contain" /></a>
            <h1 class="text-2xl font-bold text-green-400">Visor HTML Jeindex</h1>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-6 gap-6 overflow-hidden">
        
        <!-- Editor Section -->
        <section class="flex-1 flex flex-col gap-4">
            <label class="text-xs font-bold text-green-500 uppercase tracking-widest pl-2">Editor HTML / CSS</label>
            <textarea 
                id="codeEditor" 
                class="w-full flex-1 p-6 font-mono text-sm bg-black/70 text-green-400 rounded-xl border border-green-900 focus:ring-2 focus:ring-green-500 outline-none resize-none shadow-[0_0_15px_rgba(34,197,94,0.2)]"
                placeholder="<!-- Escribe aquí tu HTML y CSS -->
<div class='p-10 bg-slate-800 rounded-lg'>
  <h1 class='text-green-400 text-3xl font-bold'>¡Hola Jeindex!</h1>
  <p class='text-white'>Escribe tu código y pulsa visualizar.</p>
</div>"
            ></textarea>
            
            <!-- Button -->
            <button 
                id="togglePreviewBtn" 
                onclick="togglePreview()"
                class="w-full py-4 bg-green-600 hover:bg-green-500 text-black font-bold rounded-xl transition duration-300 shadow-[0_0_20px_rgba(22,163,74,0.4)]"
            >
                Visualizar Código
            </button>
        </section>
    </main>

    <!-- Preview Overlay -->
    <div id="previewOverlay" class="preview-overlay">
        <div class="absolute top-4 right-4 flex gap-2">
            <button onclick="setPreviewMode('mobile')" class="px-4 py-2 bg-slate-800 rounded-lg text-green-400 border border-green-700">📱 Móvil</button>
            <button onclick="setPreviewMode('tablet')" class="px-4 py-2 bg-slate-800 rounded-lg text-green-400 border border-green-700">📱 Tablet</button>
            <button onclick="setPreviewMode('desktop')" class="px-4 py-2 bg-slate-800 rounded-lg text-green-400 border border-green-700">💻 PC</button>
            <button onclick="togglePreview()" class="px-4 py-2 bg-red-900/50 rounded-lg text-red-400 border border-red-700">❌ Cerrar</button>
        </div>
        
        <div id="previewFrameContainer" class="w-full h-[80vh] max-w-6xl bg-white rounded-2xl overflow-hidden shadow-2xl border-4 border-green-500/30 transition-all duration-500">
            <iframe id="previewFrame" class="w-full h-full border-0"></iframe>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tech-bg');
        const ctx = canvas.getContext('2d');
        let width, height, lines;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            lines = [];
            for (let i = 0; i < 40; i++) {
                lines.push({ x: Math.random() * width, y: Math.random() * height, vx: Math.random() * 2 - 1, vy: Math.random() * 2 - 1 });
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.1)';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(74, 222, 128, 0.15)';
            ctx.beginPath();
            lines.forEach((line, i) => {
                line.x += line.vx; line.y += line.vy;
                if (line.x < 0 || line.x > width) line.vx *= -1;
                if (line.y < 0 || line.y > height) line.vy *= -1;
                ctx.moveTo(line.x, line.y);
                ctx.lineTo(lines[(i + 1) % lines.length].x, lines[(i + 1) % lines.length].y);
            });
            ctx.stroke();
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        draw();

        // Editor and Preview Logic
        const editor = document.getElementById('codeEditor');
        const preview = document.getElementById('previewFrame');
        const container = document.getElementById('previewFrameContainer');
        const overlay = document.getElementById('previewOverlay');

        function updatePreview() {
            const content = `
                <html>
                <head>
                    <script src="https://cdn.tailwindcss.com"><\/script>
                </head>
                <body class="bg-gray-50 p-4">
                    ${editor.value}
                </body>
                </html>
            `;
            preview.srcdoc = content;
        }

        function togglePreview() {
            if (overlay.style.display === 'flex') {
                overlay.style.display = 'none';
            } else {
                updatePreview();
                overlay.style.display = 'flex';
            }
        }

        function setPreviewMode(mode) {
            const widths = { 'mobile': '375px', 'tablet': '768px', 'desktop': '100%' };
            container.style.width = widths[mode];
        }
    </script>
</body>
</html>
